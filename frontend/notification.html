<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | BloodBridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= Header ================= -->
    <header class="header">
        <div class="left-header">
            <button type="button" class="back-btn2" onclick="goBack()">← Back</button>
            <div class="header-content">
                <h1>Notifications</h1>
                <div class="count">
                    <span class="dot"></span>
                    <span class="notification-count">0</span> New
                </div>
            </div>
        </div>
        <p class="subtitle">
            Live updates for blood requests and donor matches
        </p>
    </header>

    <!-- ================= Notifications ================= -->
    <main class="container">

        <!-- JS will inject notifications here -->
        <div class="notification-container">
            <!-- Dynamic notifications -->
        </div>
    </main>

    <!-- ================= Footer ================= -->
    <footer class="footer">
        <p>© 2026 BloodBridge | Notification Center</p>
    </footer>

    <script src="main.js"></script>
</body>
</html>
