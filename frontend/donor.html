<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor|BloodBridge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ==================== Navbar ================== -->
    <nav class="navbar">
        <div class="nav-left">
            <button type="button" class="back-btn" onclick="goBack()">← Back</button>
            <div class="logo">
                <img src="Logo.png.png" alt="BloodBridge Logo">
                <span class="blood">Blood</span><span class="bridge">Bridge</span>
            </div>
        </div>

        <div class="nav-right">
            <div class="notification">
                <a href="notification.html" class="notification-link">
                    🔔
                    <span class="badge" id="notificationCount"></span>
                </a>
            </div>
            <ul class="nav-links">
                <li><a href="signin.html">Login</a></li>
                <li><a href="About.html">About Us</a></li>
                <li><a href="Contact.html">Contact</a></li>
            </ul>
        </div>
    </nav>

    <!-- ===================== Donor section ========================= -->
    <section class="donor-section">
        <div class="donor-card">
            <h1>Donate Blood, Save Lives ❤️</h1>
            <p class="donor-subtitle">
                Your one step can become someone’s second chance at life.
            </p>
            <form class="donor-form">
                <div class="donor-name">
                    <label>Full Name</label>
                    <input name="name" type="text" placeholder="Enter your full name" required>
                </div>

                <div class="donor-mail">
                    <label>Email Address</label>
                    <input name="email" type="email" placeholder="you@example.com" required>
                </div>

                <div class="donor-number">
                    <label>Mobile Number</label>
                    <input name="number" type="tel" placeholder="10-digit mobile number" required>
                </div>

                <div class="donor-blood">
                    <label>Blood Group</label>
                    <select name="bloodgroup" required>
                        <option value="">Select blood group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </div>

                <div class="donor-location">
                    <label>Location / City</label>
                    <input name="location" type="text" placeholder="Your city" required>
                </div>

                <div class="donor-availability">
                    <label>Availability</label>
                    <select name="availability" required>
                        <option value="">Select availability</option>
                        <option>Available Now</option>
                        <option>Within 24 Hours</option>
                        <option>Within 3 Days</option>
                    </select>
                </div>

                <button type="submit" class="donor-btn">
                    Become a Donor
                </button>
            </form>
        </div>
    </section>

    <!-- ================= Footer ================= -->
    <footer class="footer">
        <p>© 2026 BloodBridge | Every Drop Counts</p>
    </footer>
    <script src="main.js"></script>

</body>
</html>
